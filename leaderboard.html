<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Al1ve casinos - Animated Leaderboard</title>
  <link rel="icon" type="image/png" href="images/hiena.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <style>
    :root {
      --card-bg: rgba(18, 15, 35, 0.8);
      --card-border: rgba(147, 51, 234, 0.4);
      --gold-color: #facc15;
      --purple-accent: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      background: #05050a url('images/leaderboard-background.jpg') no-repeat center top fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    main {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
      flex: 1;
      animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Animált fejléc cím */
    .title-section {
      text-align: center;
      margin-top: 60px;
      margin-bottom: 25px;
    }

    .title-section h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--gold-color);
      text-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
      animation: titleGlow 3s infinite alternate ease-in-out;
    }

    @keyframes titleGlow {
      from { text-shadow: 0 0 15px rgba(250, 204, 21, 0.3); transform: scale(1); }
      to { text-shadow: 0 0 30px rgba(250, 204, 21, 0.7); transform: scale(1.02); }
    }

    /* Felső statisztikai kártyák animációval */
    .stats-overview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--purple-accent);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.25);
    }

    .stat-icon {
      font-size: 1.5rem;
      color: var(--purple-accent);
      animation: iconPulse 2s infinite ease-in-out;
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .stat-info .stat-title {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-info .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* Dobogó animációk */
    .podium-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 15px;
      margin-bottom: 35px;
    }

    .podium-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 15px;
      text-align: center;
      width: 30%;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .podium-card:hover {
      transform: translateY(-8px);
    }

    .podium-card.first {
      border: 2px solid var(--gold-color);
      background: linear-gradient(180deg, rgba(250, 204, 21, 0.18) 0%, rgba(18, 15, 35, 0.85) 100%);
      transform: translateY(-12px);
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.2);
    }

    .podium-card.first:hover {
      transform: translateY(-18px) scale(1.02);
    }

    .avatar-wrapper {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto 10px auto;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--purple-accent);
      transition: transform 0.3s ease;
    }

    .podium-card:hover .avatar-wrapper img {
      transform: rotate(5deg) scale(1.05);
    }

    .podium-card.first .avatar-wrapper img {
      border-color: var(--gold-color);
    }

    .rank-tag {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      border: 1px solid var(--purple-accent);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-weight: 800;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .podium-card.first .rank-tag {
      background: var(--gold-color);
      color: #000;
      border: none;
    }

    .podium-name { font-weight: 700; font-size: 0.95rem; margin-top: 5px; }
    .podium-prize { font-size: 1.2rem; font-weight: 800; color: var(--gold-color); margin: 3px 0; }
    .podium-wager { font-size: 0.8rem; color: #94a3b8; }

    /* Táblázat stílusok és finom sor-animáció */
    .table-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 15px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { color: #64748b; font-size: 0.8rem; text-transform: uppercase; padding: 12px 15px; font-weight: 600; }
    
    td { 
      padding: 14px 15px; 
      font-size: 0.9rem; 
      border-top: 1px solid rgba(255, 255, 255, 0.05); 
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    tr {
      transition: all 0.2s ease-in-out;
    }

    tr:hover td {
      background-color: rgba(168, 85, 247, 0.1);
      transform: scale(1.005);
    }

    .player-cell { display: flex; align-items: center; gap: 10px; }
    .player-cell img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }

    @media (max-width: 768px) {
      .stats-overview { grid-template-columns: 1fr; }
      .podium-container { flex-direction: column; align-items: center; }
      .podium-card { width: 100%; transform: none !important; }
    }
  </style>
</head>
<body>

  <main>
    <div class="title-section">
      <h1>750$ Winovo Leaderboard</h1>
    </div>

    <!-- Statisztikák -->
    <div class="stats-overview">
      <div class="stat-card">
        <i class="fa-solid fa-trophy stat-icon"></i>
        <div class="stat-info">
          <div class="stat-title">Total Prize Pool</div>
          <div class="stat-value">$750</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-users stat-icon"></i>
        <div class="stat-info">
          <div class="stat-title">Active Racers</div>
          <div class="stat-value">27</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-clock stat-icon"></i>
        <div class="stat-info">
          <div class="stat-title">Race Ends In</div>
          <div class="stat-value">27d 11h 50m</div>
        </div>
      </div>
    </div>

    <!-- Dobogó -->
    <div class="podium-container">
      <div class="podium-card">
        <div class="avatar-wrapper">
          <img src="images/hiena.png" alt="Avatar">
          <div class="rank-tag">2</div>
        </div>
        <div class="podium-name">fkreator33</div>
        <div class="podium-prize">$200</div>
        <div class="podium-wager">Wager: $200</div>
      </div>

      <div class="podium-card first">
        <div class="avatar-wrapper">
          <img src="images/hiena.png" alt="Avatar">
          <div class="rank-tag">1</div>
        </div>
        <div class="podium-name">nocnoc</div>
        <div class="podium-prize">$300</div>
        <div class="podium-wager">Wager: $300</div>
      </div>

      <div class="podium-card">
        <div class="avatar-wrapper">
          <img src="images/hiena.png" alt="Avatar">
          <div class="rank-tag">3</div>
        </div>
        <div class="podium-name">dzsan</div>
        <div class="podium-prize">$150</div>
        <div class="podium-wager">Wager: $150</div>
      </div>
    </div>

    <!-- Ranglista táblázat -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Prize</th>
            <th style="text-align: right;">Wager</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>4+</td>
            <td>
              <div class="player-cell">
                <img src="images/hiena.png" alt="Player">
                <span>Dabiggoat2</span>
              </div>
            </td>
            <td style="color: var(--gold-color); font-weight: 700;">$300</td>
            <td style="text-align: right;">171d 11h 50m</td>
          </tr>
          <tr>
            <td>5+</td>
            <td>
              <div class="player-cell">
                <img src="images/hiena.png" alt="Player">
                <span>fkreator33</span>
              </div>
            </td>
            <td style="color: var(--gold-color); font-weight: 700;">$150</td>
            <td style="text-align: right;">27d 1h 50m</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
